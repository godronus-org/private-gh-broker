name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm test
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

  org:
    if: github.repository_owner == 'godronus-org' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: godronus-org/toolkit/.github/workflows/pr-checks.yaml@v1
